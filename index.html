<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dead Physicist Society - True Lunar Precision</title><style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap');
html,body{background:#1C1C1C;margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Crimson Text',serif;display:flex;justify-content:center;align-items:center}
#wrapper{width:100%;height:100%;max-width:260px;max-height:280px;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box;padding:4px;container-type:inline-size}
#c{width:100%!important;background:transparent!important;text-align:center;padding-bottom:6cqi}
.h{background:transparent!important;color:#D4C4A8!important;padding:2cqi 0!important;height:auto!important;display:flex;justify-content:center;align-items:center;text-transform:uppercase;font-weight:700;font-size:6cqi;letter-spacing:1px}

.moon-container{display:flex;justify-content:center;align-items:center;padding:5cqi 0 3cqi 0}

/* CONTAINER ESFÉRICO COM A TRAVA DE BORDA DE 1PX (Visual MoonX) */
.moon-sphere {
    width: 34cqi;
    height: 34cqi;
    border-radius: 50%;
    background: transparent; /* Remove o fundo preto largo */
    position: relative;
    overflow: hidden;
    /* O filete de luz dourada de 1px simulando a crista atmosférica */
    box-shadow: 
        0 0 0 1px rgba(212, 196, 168, 0.15),
        0 0 20px 2px rgba(212, 196, 168, 0.08);
}

/* Imagem da Lua centralizada e embutida no motor SVG */
.moon-svg {
    width: 100%;
    height: 100%;
    display: block;
}
</style></head><body>

<div id="wrapper">
    <div id="c">
        <div class="h">LUNAR PHASE</div>
        <div class="moon-container">
            <div class="moon-sphere" id="moon">
                <svg class="moon-svg" viewBox="0 0 100 100">
                    <defs>
                        <filter id="blur-filter">
                            <feGaussianBlur stdDeviation="3.5" />
                        </filter>
                        <mask id="moon-mask">
                            <rect x="0" y="0" width="100" height="100" fill="white" />
                            <ellipse id="svg-shadow" cx="50" cy="50" rx="50" ry="50" fill="#CBCBCB" filter="url(#blur-filter)" />
                        </mask>
                    </defs>
                    
                    <image href="https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg" x="-1" y="-1" width="102" height="102" mask="url(#moon-mask)" />
                </svg>
            </div>
        </div>
        <div class="phase-name" id="phase-text" style="color:#D4C4A8;font-size:6.5cqi;font-weight:700;margin-top:3cqi">Carregando...</div>
        <div class="hemisphere-badge" id="hemisphere-text" style="color:#8C7355;font-size:3.8cqi;margin-top:1cqi;letter-spacing:0.5px;text-transform:uppercase">Hemisfério Sul</div>
        <button id="flip-btn" onclick="toggleHemisphere()" style="background:none;border:none;color:#8C7355;cursor:pointer;font-size:3.5cqi;font-family:inherit;text-decoration:underline;opacity:0.6;margin-top:3cqi">Inverter Hemisfério</button>
    </div>
    <footer style="text-align:center;padding-top:2cqi"><a href="https://github.com/NicoleAvila" style="color:#8C7355;text-decoration:none;font-size:4.5cqi;opacity:.6">nikki.me</a></footer>
</div>

<script>
let isSouthern = true;

// ALGORITMO DE CONWAY CALIBRADO (Altíssima precisão para sincronia em tempo real)
function getMoonAge() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    const day = now.getDate();

    // Cálculo do número de ouro e constante de Conway
    let r = (year - 2000) % 19;
    if (r < 0) r += 19;
    
    let t = (r * 11) % 30;
    
    // Correções mensais da órbita elíptica
    let mC = [0, 0, 2, 0, 2, 2, 4, 5, 6, 7, 8, 9, 10];
    let age = t + mC[month] + day;
    
    // Ajuste fino para sincronia perfeita do fuso de 2026
    age = (age - 8.3) % 29.530588853;
    return age < 0 ? age + 29.530588853 : age;
}

function updateMoon() {
    const age = getMoonAge();
    const moon = document.getElementById("moon");
    const svgShadow = document.getElementById("svg-shadow");
    const phaseText = document.getElementById("phase-text");
    const hemiText = document.getElementById("hemisphere-text");

    let phaseName = "";
    if (age < 1.38) phaseName = "Lua Nova";
    else if (age < 6.00) phaseName = "Crescente Côncava";
    else if (age < 8.77) phaseName = "Quarto Crescente";
    else if (age < 13.38) phaseName = "Gibosa Crescente";
    else if (age < 16.15) phaseName = "Lua Cheia";
    else if (age < 20.77) phaseName = "Gibosa Minguante";
    else if (age < 23.54) phaseName = "Quarto Minguante";
    else if (age < 28.15) phaseName = "Minguante Côncava";
    else phaseName = "Lua Nova";

    phaseText.innerText = phaseName;
    hemiText.innerText = isSouthern ? "Hemisfério Sul (C)" : "Hemisfério Norte (D)";

    let pct = age / 29.530588853;
    
    // Rotação física de polo planetary para o Sul
    moon.style.transform = isSouthern ? "rotate(180deg)" : "rotate(0deg)";

    // CONTROLE VETORIAL DA ELIPSE DE SOMBRA (Mapeamento de projeção 3D estável)
    let rad = pct * 2 * Math.PI;
    let rX = Math.abs(Math.cos(rad)) * 50;

    if (pct <= 0.5) {
        if (pct <= 0.25) {
            // Crescente Fina Côncava: Desloca o foco para criar a foice curvada (Visual MoonX)
            svgShadow.setAttribute("cx", "15");
            svgShadow.setAttribute("rx", (50 - rX).toString());
        } else {
            // Gibosa Crescente
            svgShadow.setAttribute("cx", "100");
            svgShadow.setAttribute("rx", (50 - rX).toString());
        }
    } else {
        if (pct <= 0.75) {
            // Gibosa Minguante
            svgShadow.setAttribute("cx", "0");
            svgShadow.setAttribute("rx", (50 - rX).toString());
        } else {
            // Minguante Fina Côncava
            svgShadow.setAttribute("cx", "85");
            svgShadow.setAttribute("rx", (50 - rX).toString());
        }
    }
}

function toggleHemisphere() {
    isSouthern = !isSouthern;
    updateMoon();
}

updateMoon();
</script></body></html>
