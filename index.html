<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dead Physicist Society - True Lunar Phase</title><style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap');
html,body{background:#1C1C1C;margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Crimson Text',serif;display:flex;justify-content:center;align-items:center}
#wrapper{width:100%;height:100%;max-width:260px;max-height:280px;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box;padding:4px;container-type:inline-size}
#c{width:100%!important;background:transparent!important;text-align:center;padding-bottom:6cqi}
.h{background:transparent!important;color:#D4C4A8!important;padding:2cqi 0!important;height:auto!important;display:flex;justify-content:center;align-items:center;text-transform:uppercase;font-weight:700;font-size:6cqi;letter-spacing:1px}

.moon-container{display:flex;justify-content:center;align-items:center;padding:5cqi 0 3cqi 0}

/* Esfera perfeitamente ajustada e limpa */
.moon-sphere {
    width: 34cqi;
    height: 34cqi;
    border-radius: 50%;
    background: #000;
    position: relative;
    overflow: hidden;
    box-shadow: 
        0 0 12px 2px rgba(212, 196, 168, 0.15), 
        0 0 25px 4px rgba(212, 196, 168, 0.05);
}

/* A imagem da Lua fica 100% visível; o JS apenas dita onde ela escurece usando máscara */
.moon-light {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    /* Transição suave e orgânica para a máscara de opacidade */
    transition: -webkit-mask-image 0.3s ease, mask-image 0.3s ease;
}
</style></head><body>

<div id="wrapper">
    <div id="c">
        <div class="h">LUNAR PHASE</div>
        <div class="moon-container">
            <div class="moon-sphere" id="moon">
                <div class="moon-light" id="light"></div>
            </div>
        </div>
        <div class="phase-name" id="phase-text" style="color:#D4C4A8;font-size:6.5cqi;font-weight:700;margin-top:3cqi">Carregando...</div>
        <div class="hemisphere-badge" id="hemisphere-text" style="color:#8C7355;font-size:3.8cqi;margin-top:1cqi;letter-spacing:0.5px;text-transform:uppercase">Hemisfério Sul</div>
        <button id="flip-btn" onclick="toggleHemisphere()" style="background:none;border:none;color:#8C7355;cursor:pointer;font-size:3.5cqi;font-family:inherit;text-decoration:underline;opacity:0.6;margin-top:3cqi">Inverter Hemisfério</button>
    </div>
    <footer style="text-align:center;padding-top:2cqi"><a href="https://github.com/NicoleAvila" style="color:#8C7355;text-decoration:none;font-size:4.5cqi;opacity:.6">nikki.me</a></footer>
</div>

<script>
let isSouthern = true;

function getMoonAge() {
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
    if (m <= 2) { y--; m += 12; }
    let a = Math.floor(y / 100); let b = Math.floor(a / 4); let c = 2 - a + b;
    let e = Math.floor(365.25 * (y + 4716)); let f = Math.floor(30.6001 * (m + 1));
    let jd = c + d + e + f - 1524.5;
    return ((jd - 2451550.1) / 29.530588853 - Math.floor((jd - 2451550.1) / 29.530588853)) * 29.53;
}

function updateMoon() {
    const age = getMoonAge();
    const moon = document.getElementById("moon");
    const light = document.getElementById("light");
    const phaseText = document.getElementById("phase-text");
    const hemiText = document.getElementById("hemisphere-text");

    let phaseName = "";
    if (age < 1.84) phaseName = "Lua Nova";
    else if (age < 5.54) phaseName = "Crescente Côncava";
    else if (age < 9.23) phaseName = "Quarto Crescente";
    else if (age < 12.92) phaseName = "Gibosa Crescente";
    else if (age < 16.61) phaseName = "Lua Cheia";
    else if (age < 20.31) phaseName = "Gibosa Minguante";
    else if (age < 24.00) phaseName = "Quarto Minguante";
    else if (age < 27.69) phaseName = "Minguante Côncava";
    else phaseName = "Lua Nova";

    phaseText.innerText = phaseName;
    hemiText.innerText = isSouthern ? "Hemisfério Sul (C)" : "Hemisfério Norte (D)";

    let pct = age / 29.53;
    
    // Inversão física real: no Hemisfério Sul, a Lua é vista de cabeça para baixo (girada 180°)
    moon.style.transform = isSouthern ? "rotate(180deg)" : "rotate(0deg)";

    // LÓGICA DE OPACIDADE RADIAL: A área escura retém 0.15 de opacidade (Luz Cinérea visível)
    // O degradê de 10% cria o terminador esfumaçado perfeito sem quebrar a borda externa
    let maskString = "";
    let p = 0;

    if (pct <= 0.25) {
        p = Math.floor(pct * 4 * 100);
        maskString = `linear-gradient(to left, rgba(0,0,0,0.15) ${100 - p}%, rgba(0,0,0,1) ${110 - p}%)`;
    } else if (pct <= 0.50) {
        p = Math.floor((pct - 0.25) * 4 * 100);
        maskString = `linear-gradient(to right, rgba(0,0,0,1) ${p}%, rgba(0,0,0,0.15) ${p + 10}%)`;
    } else if (pct <= 0.75) {
        p = Math.floor((pct - 0.50) * 4 * 100);
        maskString = `linear-gradient(to right, rgba(0,0,0,0.15) ${p}%, rgba(0,0,0,1) ${p + 10}%)`;
    } else {
        p = Math.floor((pct - 0.75) * 4 * 100);
        maskString = `linear-gradient(to left, rgba(0,0,0,1) ${p}%, rgba(0,0,0,0.15) ${p + 10}%)`;
    }

    light.style.webkitMaskImage = maskString;
    light.style.maskImage = maskString;
}

function toggleHemisphere() {
    isSouthern = !isSouthern;
    updateMoon();
}

updateMoon();
</script></body></html>
