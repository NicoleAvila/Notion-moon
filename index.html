<script>
let isSouthern = true;

function getMoonAge() {
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
    if (m <= 2) { y--; m += 12; }
    let a = Math.floor(y / 100); let b = Math.floor(a / 4); let c = 2 - a + b;
    let e = Math.floor(365.25 * (y + 4716)); let f = Math.floor(30.6001 * (m + 1));
    let jd = c + d + e + f - 1524.5;
    return ((jd - 2451550.1) / 29.530588853 - Math.floor((jd - 2451550.1) / 29.530588853)) * 29.53;
}

function updateMoon() {
    const age = getMoonAge();
    const light = document.getElementById("light");
    const phaseText = document.getElementById("phase-text");
    const hemiText = document.getElementById("hemisphere-text");

    let phaseName = "";
    if (age < 1.84) phaseName = "Lua Nova";
    else if (age < 5.54) phaseName = "Crescente Côncava";
    else if (age < 9.23) phaseName = "Quarto Crescente";
    else if (age < 12.92) phaseName = "Gibosa Crescente";
    else if (age < 16.61) phaseName = "Lua Cheia";
    else if (age < 20.31) phaseName = "Gibosa Minguante";
    else if (age < 24.00) phaseName = "Quarto Minguante";
    else if (age < 27.69) phaseName = "Minguante Côncava";
    else phaseName = "Lua Nova";

    phaseText.innerText = phaseName;
    hemiText.innerText = isSouthern ? "Hemisfério Sul (C)" : "Hemisfério Norte (D)";

    let pct = age / 29.53;
    let maskString = "";

    // MÁSCARA RADIAL ELÍPTICA: Controla a curvatura tridimensional exata do terminador
    if (isSouthern) {
        if (pct <= 0.25) {
            // Crescente Fina (Foice em formato de C)
            let p = Math.floor(pct * 4 * 100);
            maskString = `radial-gradient(ellipse ${100 - p}% 100% at 0% 50%, black 92%, transparent 100%)`;
        } else if (pct <= 0.50) {
            // Gibosa Crescente (Engordando até encher)
            let p = Math.floor((pct - 0.25) * 4 * 100);
            maskString = `radial-gradient(ellipse ${p}% 100% at 0% 50%, transparent ${p - 8}%, black ${p}%)`;
        } else if (pct <= 0.75) {
            // Gibosa Minguante
            let p = Math.floor((pct - 0.50) * 4 * 100);
            maskString = `radial-gradient(ellipse ${100 - p}% 100% at 100% 50%, transparent ${(100 - p) - 8}%, black ${100 - p}%)`;
        } else {
            // Minguante Fina
            let p = Math.floor((pct - 0.75) * 4 * 100);
            maskString = `radial-gradient(ellipse ${p}% 100% at 100% 50%, black 92%, transparent 100%)`;
        }
    } else {
        // Hemisfério Norte (Inversão dos polos elípticos de foco)
        if (pct <= 0.25) {
            let p = Math.floor(pct * 4 * 100);
            maskString = `radial-gradient(ellipse ${100 - p}% 100% at 100% 50%, black 92%, transparent 100%)`;
        } else if (pct <= 0.50) {
            let p = Math.floor((pct - 0.25) * 4 * 100);
            maskString = `radial-gradient(ellipse ${p}% 100% at 100% 50%, transparent ${p - 8}%, black ${p}%)`;
        } else if (pct <= 0.75) {
            let p = Math.floor((pct - 0.50) * 4 * 100);
            maskString = `radial-gradient(ellipse ${100 - p}% 100% at 0% 50%, transparent ${(100 - p) - 8}%, black ${100 - p}%)`;
        } else {
            let p = Math.floor((pct - 0.75) * 4 * 100);
            maskString = `radial-gradient(ellipse ${p}% 100% at 0% 50%, black 92%, transparent 100%)`;
        }
    }

    light.style.webkitMaskImage = maskString;
    light.style.maskImage = maskString;
}

function toggleHemisphere() {
    isSouthern = !isSouthern;
    updateMoon();
}

updateMoon();
</script>
