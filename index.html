<script>
let isSouthern = true;

// 1. Calibração de Época precisa para o fuso local em tempo real
function getMoonAge() {
    const now = new Date();
    const utcDate = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes());
    
    // Época astronômica de referência para Lua Nova estável
    const baseNewMoon = Date.UTC(2000, 0, 6, 18, 14); 
    const synodicPeriod = 29.530588853 * 24 * 60 * 60 * 1000;
    
    let msSinceNew = utcDate - baseNewMoon;
    let ageInMs = msSinceNew % synodicPeriod;
    if (ageInMs < 0) ageInMs += synodicPeriod;
    
    return (ageInMs / synodicPeriod) * 29.530588853;
}

function updateMoon() {
    const age = getMoonAge();
    const moon = document.getElementById("moon");
    const light = document.getElementById("light");
    const phaseText = document.getElementById("phase-text");
    const hemiText = document.getElementById("hemisphere-text");

    let phaseName = "";
    if (age < 1.0) phaseName = "Lua Nova";
    else if (age < 6.38) phaseName = "Crescente Côncava";
    else if (age < 8.38) phaseName = "Quarto Crescente";
    else if (age < 13.77) phaseName = "Gibosa Crescente";
    else if (age < 15.77) phaseName = "Lua Cheia";
    else if (age < 21.15) phaseName = "Gibosa Minguante";
    else if (age < 23.15) phaseName = "Quarto Minguante";
    else if (age < 28.53) phaseName = "Minguante Côncava";
    else phaseName = "Lua Nova";

    phaseText.innerText = phaseName;
    hemiText.innerText = isSouthern ? "Hemisfério Sul (C)" : "Hemisfério Norte (D)";

    let pct = age / 29.530588853;
    
    // Rotação física de 180° que o Hemisfério Sul exige para inverter o relevo real da foto
    moon.style.transform = isSouthern ? "rotate(180deg)" : "rotate(0deg)";

    let maskString = "";
    let rad = (age / 29.530588853) * 2 * Math.PI;
    
    // Projeção elíptica tridimensional da órbita (Calcula a largura da curvatura da sombra)
    let k = Math.abs(Math.cos(rad)) * 100;

    // 2. GEOMETRIA DE MÁSCARA RADIAL (Estilo MoonX: deforma a sombra em arco esférico)
    if (pct <= 0.5) {
        if (pct <= 0.25) {
            // Crescente Fina Côncava: Cria a foice curvando para dentro
            maskString = `radial-gradient(ellipse ${100 - k}% 100% at 100% 50%, rgba(0,0,0,1) ${k}%, rgba(0,0,0,0.12) ${k + 12}%)`;
        } else {
            // Gibosa Crescente: Curva expandindo para fora
            maskString = `radial-gradient(ellipse ${k}% 100% at 0% 50%, rgba(0,0,0,1) ${100 - k}%, rgba(0,0,0,0.12) ${112 - k}%)`;
        }
    } else {
        if (pct <= 0.75) {
            // Gibosa Minguante
            maskString = `radial-gradient(ellipse ${k}% 100% at 100% 50%, rgba(0,0,0,1) ${100 - k}%, rgba(0,0,0,0.12) ${112 - k}%)`;
        } else {
            // Minguante Fina Côncava
            maskString = `radial-gradient(ellipse ${100 - k}% 100% at 0% 50%, rgba(0,0,0,1) ${k}%, rgba(0,0,0,0.12) ${k + 12}%)`;
        }
    }

    light.style.webkitMaskImage = maskString;
    light.style.maskImage = maskString;
}

function toggleHemisphere() {
    isSouthern = !isSouthern;
    updateMoon();
}

updateMoon();
</script>
