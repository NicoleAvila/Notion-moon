<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dead Physicist Society - Lunar Glow</title><style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap');
html,body{background:#1C1C1C;margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Crimson Text',serif;display:flex;justify-content:center;align-items:center}
#wrapper{width:100%;height:100%;max-width:260px;max-height:280px;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box;padding:4px;container-type:inline-size}
#c{width:100%!important;background:transparent!important;text-align:center;padding-bottom:6cqi}
.h{background:transparent!important;color:#D4C4A8!important;padding:2cqi 0!important;height:auto!important;display:flex;justify-content:center;align-items:center;text-transform:uppercase;font-weight:700;font-size:6cqi;letter-spacing:1px}

.moon-container{display:flex;justify-content:center;align-items:center;padding:5cqi 0 3cqi 0}

.moon-sphere {
    width: 34cqi;
    height: 34cqi;
    border-radius: 50%;
    background: #1C1C1C;
    position: relative;
    transition: 0.5s;
    box-shadow: 
        0 0 15px 1px rgba(212, 196, 168, 0.22), 
        0 0 30px 4px rgba(212, 196, 168, 0.08);
}

.moon-sphere::before, .moon-light {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transition: 0.5s;
}

.moon-sphere::before {
    background: radial-gradient(circle at 50% 50%, #252525 0%, #151515 70%, #1C1C1C 100%);
    z-index: 1;
}

.moon-light {
    background: radial-gradient(circle at 50% 50%, #FFFDF9 0%, #D4C4A8 65%, #A8967A 100%);
    z-index: 2;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
    transform-origin: center;
}

.phase-name{color:#D4C4A8;font-size:6.5cqi;font-weight:700;margin-top:3cqi}
.hemisphere-badge{color:#8C7355;font-size:3.8cqi;margin-top:1cqi;letter-spacing:0.5px;text-transform:uppercase}

#flip-btn{background:none;border:none;color:#8C7355;cursor:pointer;font-size:3.5cqi;font-family:inherit;text-decoration:underline;opacity:0.6;margin-top:3cqi;transition:0.3s}
#flip-btn:hover{opacity:1;color:#D4C4A8}

footer{text-align:center;padding-top:2cqi}footer a{color:#8C7355;text-decoration:none;font-size:4.5cqi;opacity:.6;transition:.3s}footer a:hover{opacity:1;color:#D4C4A8}
</style></head><body>
<div id="wrapper">
    <div id="c">
        <div class="h">LUNAR PHASE</div>
        <div class="moon-container">
            <div class="moon-sphere" id="moon">
                <div class="moon-light" id="light"></div>
            </div>
        </div>
        <div class="phase-name" id="phase-text">Carregando...</div>
        <div class="hemisphere-badge" id="hemisphere-text">Hemisfério Sul</div>
        <button id="flip-btn" onclick="toggleHemisphere()">Inverter Hemisfério</button>
    </div>
    <footer><a href="https://github.com/NicoleAvila">nikki.me</a></footer>
</div>

<script>
let isSouthern = true;

function getMoonAge() {
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
    if (m <= 2) { y--; m += 12; }
    let a = Math.floor(y / 100);
    let b = Math.floor(a / 4);
    let c = 2 - a + b;
    let e = Math.floor(365.25 * (y + 4716));
    let f = Math.floor(30.6001 * (m + 1));
    let jd = c + d + e + f - 1524.5;
    let daysSinceNew = jd - 2451550.1; 
    let newMoons = daysSinceNew / 29.530588853;
    return (newMoons - Math.floor(newMoons)) * 29.53;
}

function updateMoon() {
    const age = getMoonAge();
    const moon = document.getElementById("moon");
    const light = document.getElementById("light");
    const phaseText = document.getElementById("phase-text");
    const hemiText = document.getElementById("hemisphere-text");

    let phaseName = "";
    if (age < 1.84) phaseName = "Lua Nova";
    else if (age < 5.54) phaseName = "Crescente Côncava";
    else if (age < 9.23) phaseName = "Quarto Crescente";
    else if (age < 12.92) phaseName = "Gibosa Crescente";
    else if (age < 16.61) phaseName = "Lua Cheia";
    else if (age < 20.31) phaseName = "Gibosa Minguante";
    else if (age < 24.00) phaseName = "Quarto Minguante";
    else if (age < 27.69) phaseName = "Minguante Côncava";
    else phaseName = "Lua Nova";

    phaseText.innerText = phaseName;
    hemiText.innerText = isSouthern ? "Hemisfério Sul (C)" : "Hemisfério Norte (D)";

    let rad = (age / 29.53) * 2 * Math.PI;
    let xX = Math.cos(rad);

    light.style.transform = `scaleX(${Math.abs(xX)})`;

    if (age <= 7.38 || age >= 22.14) {
        light.style.zIndex = 1;
        moon.style.backgroundColor = "#D4C4A8";
        light.style.background = "#1C1C1C"; 
    } else {
        light.style.zIndex = 2;
        moon.style.backgroundColor = "#1C1C1C";
        light.style.background = "radial-gradient(circle at 50% 50%, #FFFDF9 0%, #D4C4A8 65%, #A8967A 100%)";
    }

    moon.style.transform = isSouthern ? "scaleX(-1) rotate(180deg)" : "scaleX(1)";
}

function toggleHemisphere() {
    isSouthern = !isSouthern;
    updateMoon();
}

updateMoon();
</script></body></html>
