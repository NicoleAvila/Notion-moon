<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dead Physicist Society - True Moon</title><style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap');
html,body{background:#1C1C1C;margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Crimson Text',serif;display:flex;justify-content:center;align-items:center}
#wrapper{width:100%;height:100%;max-width:260px;max-height:280px;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box;padding:4px;container-type:inline-size}
#c{width:100%!important;background:transparent!important;text-align:center;padding-bottom:6cqi}
.h{background:transparent!important;color:#D4C4A8!important;padding:2cqi 0!important;height:auto!important;display:flex;justify-content:center;align-items:center;text-transform:uppercase;font-weight:700;font-size:6cqi;letter-spacing:1px}

.moon-container{display:flex;justify-content:center;align-items:center;padding:5cqi 0 3cqi 0}

/* CONTAINER PAI: Enjaula todo o borrão para não vazar manchas pretas no Notion */
.moon-sphere {
    width: 34cqi;
    height: 34cqi;
    border-radius: 48%;
    position: relative;
    overflow: hidden !important;
    /* Força o Webkit mobile a respeitar o overflow esférico */
    -webkit-mask-image: -webkit-radial-gradient(white, black);
    box-shadow: 
        0 0 15px 2px rgba(212, 196, 168, 0.2), 
        0 0 30px 4px rgba(212, 196, 168, 0.08);
}

/* 1. A LUA REALISTA INTEIRINHA FIXA NO FUNDO */
.moon-light {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg');
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    z-index: 1;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
}

/* 2. MÁSCARA COM OPACIDADE ATRÁS (Luz Cinérea com o mesmo raio exato) */
.moon-dark-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #22201E 0%, #11100F 80%);
    opacity: 0.30;
    z-index: 2;
    pointer-events: none;
}

/* 3. A SOMBRA ESFUMAÇADA QUE FAZ AS FASES LUNARES */
.moon-terminator {
    position: absolute;
    top: -10%;
    width: 140%; /* Um pouco maior para cobrir a transição elíptica */
    height: 120%;
    background: #1C1C1C; /* Mesma cor do fundo do Notion */
    filter: blur(6px); /* Esfumaça a borda da sombra nas crateras de forma natural */
    z-index: 3;
    transition: left 0.4s ease, width 0.4s ease, border-radius 0.4s ease;
    pointer-events: none;
}

.phase-name{color:#D4C4A8;font-size:6.5cqi;font-weight:700;margin-top:3cqi}
.hemisphere-badge{color:#8C7355;font-size:3.8cqi;margin-top:1cqi;letter-spacing:0.5px;text-transform:uppercase}
#flip-btn{background:none;border:none;color:#8C7355;cursor:pointer;font-size:3.5cqi;font-family:inherit;text-decoration:underline;opacity:0.6;margin-top:3cqi}
#flip-btn:hover{opacity:1;color:#D4C4A8}
footer{text-align:center;padding-top:2cqi}footer a{color:#8C7355;text-decoration:none;font-size:4.5cqi;opacity:.6}
</style></head><body>
<div id="wrapper">
    <div id="c">
        <div class="h">LUNAR PHASE</div>
        <div class="moon-container">
            <div class="moon-sphere" id="moon">
                <div class="moon-light"></div>
                <div class="moon-dark-bg"></div>
                <div class="moon-terminator" id="shadow"></div>
            </div>
        </div>
        <div class="phase-name" id="phase-text">Carregando...</div>
        <div class="hemisphere-badge" id="hemisphere-text">Hemisfério Sul</div>
        <button id="flip-btn" onclick="toggleHemisphere()">Inverter Hemisfério</button>
    </div>
    <footer><a href="https://github.com/NicoleAvila">nikki.me</a></footer>
</div>

<script>
let isSouthern = true;

function getMoonAge() {
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
    if (m <= 2) { y--; m += 12; }
    let a = Math.floor(y / 100); let b = Math.floor(a / 4); let c = 2 - a + b;
    let e = Math.floor(365.25 * (y + 4716)); let f = Math.floor(30.6001 * (m + 1));
    let jd = c + d + e + f - 1524.5;
    return ((jd - 2451550.1) / 29.530588853 - Math.floor((jd - 2451550.1) / 29.530588853)) * 29.53;
}

function updateMoon() {
    const age = getMoonAge();
    const shadow = document.getElementById("shadow");
    const phaseText = document.getElementById("phase-text");
    const hemiText = document.getElementById("hemisphere-text");

    let phaseName = "";
    if (age < 1.84) phaseName = "Lua Nova";
    else if (age < 5.54) phaseName = "Crescente Côncava";
    else if (age < 9.23) phaseName = "Quarto Crescente";
    else if (age < 12.92) phaseName = "Gibosa Crescente";
    else if (age < 16.61) phaseName = "Lua Cheia";
    else if (age < 20.31) phaseName = "Gibosa Minguante";
    else if (age < 24.00) phaseName = "Quarto Minguante";
    else if (age < 27.69) phaseName = "Minguante Côncava";
    else phaseName = "Lua Nova";

    phaseText.innerText = phaseName;
    hemiText.innerText = isSouthern ? "Hemisfério Sul (C)" : "Hemisfério Norte (D)";

    let pct = age / 29.53;

    // LÓGICA DE ÓRBITA SUAVE E ESFUMAÇADA (Movimento da cortina Blur)
    if (pct <= 0.5) {
        if (pct <= 0.25) {
            // Crescente Fina Côncava
            let shift = (pct * 4) * 60;
            if (isSouthern) {
                shadow.style.left = "-40%";
                shadow.style.width = (140 - shift) + "%";
                shadow.style.borderRadius = "50%";
            } else {
                shadow.style.left = (-20 + shift) + "%";
                shadow.style.width = "140%";
                shadow.style.borderRadius = "50%";
            }
        } else {
            // Gibosa Crescente
            let shift = ((pct - 0.25) * 4) * 70;
            if (isSouthern) {
                shadow.style.left = "-100%";
                shadow.style.width = (80 - shift) + "%";
                shadow.style.borderRadius = "0 50% 50% 0 / 0 50% 50% 0";
            } else {
                shadow.style.left = "-100%";
                shadow.style.width = (140 - shift) + "%";
                shadow.style.borderRadius = "0 50% 50% 0 / 0 50% 50% 0";
            }
        }
    } else {
        if (pct <= 0.75) {
            // Gibosa Minguante
            let shift = ((pct - 0.5) * 4) * 70;
            if (isSouthern) {
                shadow.style.left = (-100 + shift) + "%";
                shadow.style.width = "80%";
                shadow.style.borderRadius = "50% 0 0 50% / 50% 0 0 50%";
            } else {
                shadow.style.left = (-100 + shift) + "%";
                shadow.style.width = "80%";
                shadow.style.borderRadius = "50% 0 0 50% / 50% 0 0 50%";
            }
        } else {
            // Minguante Fina Côncava
            let shift = ((pct - 0.75) * 4) * 60;
            if (isSouthern) {
                shadow.style.left = (-20 + shift) + "%";
                shadow.style.width = "140%";
                shadow.style.borderRadius = "50%";
            } else {
                shadow.style.left = "20%";
                shadow.style.width = (20 + shift) + "%";
                shadow.style.borderRadius = "50%";
            }
        }
    }
}

function toggleHemisphere() {
    isSouthern = !isSouthern;
    updateMoon();
}

updateMoon();
</script></body></html>
